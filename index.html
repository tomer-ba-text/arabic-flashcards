<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="תרגול ערבית">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EFE6D6">
<link rel="manifest" href="manifest.json">

<title>תרגול ערבית פלסטינית</title>
<style>
  :root{
    color-scheme: light;
    --linen:#EFE6D6;
    --linen-dark:#E2D6BF;
    --ink:#2B2620;
    --ink-soft:#6b6255;
    --thread:#7A2E2E;
    --thread-soft:#a85a4f;
    --olive:#5B6B43;
    --olive-soft:#7c8a5e;
    --gold:#B08D3E;
    --card:#FAF5EA;
    --good:#5B6B43;
    --bad:#9C4A3C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--linen);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(122,46,46,0.07) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 18px 14px 40px;
  }
  .wrap{ width:100%; max-width:480px; }

  header{ text-align:center; margin: 6px 0 18px; }
  header h1{
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    margin: 0 0 4px;
    letter-spacing: 0.3px;
  }
  header .sub{
    font-size: 13px;
    color: var(--ink-soft);
  }

  .stitchline{
    height: 10px;
    margin: 14px 0;
    background-image: repeating-linear-gradient(
      -45deg, var(--thread) 0 6px, transparent 6px 12px
    );
    opacity: 0.55;
    mask-image: linear-gradient(90deg, transparent, black 8%, black 92%, transparent);
  }

  .chips{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:16px;
  }
  .chip{
    font-size:12.5px;
    padding:6px 12px;
    border-radius:20px;
    border:1.5px solid var(--olive-soft);
    background: transparent;
    color: var(--olive);
    cursor:pointer;
    user-select:none;
    transition: all .15s ease;
  }
  .chip.active{
    background: var(--olive);
    color: #fff;
    border-color: var(--olive);
  }

  .stats{
    display:flex;
    justify-content:space-between;
    font-size:12.5px;
    color:var(--ink-soft);
    padding: 0 4px;
    margin-bottom: 8px;
  }
  .stats b{ color:var(--ink); }

  .progress-track{
    height:5px;
    width:100%;
    background: var(--linen-dark);
    border-radius: 3px;
    overflow:hidden;
    margin-bottom: 18px;
  }
  .progress-fill{
    height:100%;
    background: var(--gold);
    width:0%;
    transition: width .25s ease;
  }

  .card{
    position:relative;
    background: var(--card);
    border-radius: 6px;
    padding: 40px 26px 30px;
    min-height: 230px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    box-shadow: 0 1px 2px rgba(43,38,32,0.06), 0 8px 24px rgba(43,38,32,0.09);
    border: 1px solid rgba(43,38,32,0.06);
  }
  .card::before, .card::after{
    content:"";
    position:absolute;
    left:14px; right:14px;
    height:10px;
    background-image: repeating-linear-gradient(
      90deg, var(--thread) 0 5px, transparent 5px 11px
    );
    opacity:0.5;
  }
  .card::before{ top:12px; }
  .card::after{ bottom:12px; }

  .corner{
    position:absolute;
    width:9px; height:9px;
    border: 1.5px solid var(--gold);
    opacity:0.6;
  }
  .corner.tl{ top:26px; left:26px; border-width:1.5px 0 0 1.5px; }
  .corner.tr{ top:26px; right:26px; border-width:1.5px 1.5px 0 0; }
  .corner.bl{ bottom:26px; left:26px; border-width:0 0 1.5px 1.5px; }
  .corner.br{ bottom:26px; right:26px; border-width:0 1.5px 1.5px 0; }

  .direction-label{
    font-size: 11.5px;
    color: var(--thread-soft);
    letter-spacing: 0.5px;
    margin-bottom: 14px;
    font-weight:bold;
  }

  .prompt{
    font-family: Tahoma, "Segoe UI", Arial, sans-serif;
    font-size: 30px;
    line-height:1.5;
    direction: rtl;
    margin-bottom: 6px;
    word-break: break-word;
  }
  .prompt.arabic{ font-size: 34px; }
  .translit{
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
    direction: ltr;
    margin-bottom: 4px;
  }

  .answer-area{
    margin-top: 18px;
    min-height: 34px;
  }
  .answer{
    font-size: 22px;
    color: var(--olive);
    font-weight:bold;
    animation: fadein .25s ease;
  }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .reveal-btn{
    margin-top: 18px;
    background: var(--ink);
    color: var(--linen);
    border:none;
    padding: 12px 26px;
    border-radius: 24px;
    font-size: 15px;
    cursor:pointer;
    font-family: inherit;
  }
  .reveal-btn:active{ transform: scale(0.97); }

  .grade-row{
    display:flex;
    gap:10px;
    margin-top: 20px;
    width:100%;
  }
  .grade-btn{
    flex:1;
    padding: 13px 8px;
    border-radius: 24px;
    border:none;
    font-size: 15px;
    font-family: inherit;
    cursor:pointer;
    color:#fff;
  }
  .grade-btn.bad{ background: var(--bad); }
  .grade-btn.good{ background: var(--good); }
  .grade-btn:active{ transform: scale(0.97); }

  .controls{
    display:flex;
    justify-content:center;
    gap: 14px;
    margin-top: 18px;
  }
  .icon-btn{
    background:transparent;
    border: 1.5px solid var(--ink-soft);
    color: var(--ink-soft);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    cursor:pointer;
    font-family: inherit;
  }

  .done-screen{
    text-align:center;
    padding: 30px 10px;
  }
  .done-screen .big{
    font-family: Georgia, serif;
    font-size: 22px;
    margin-bottom: 10px;
  }
  .done-screen .score{
    font-size: 40px;
    color: var(--olive);
    font-weight:bold;
    margin-bottom: 6px;
  }

  footer{
    margin-top: 26px;
    text-align:center;
    font-size: 11.5px;
    color: var(--ink-soft);
    opacity:0.75;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>תרגול ערבית פלסטינית</h1>
    <div class="sub">כרטיסיות לתרגול אופליין · בלי אינטרנט</div>
  </header>

  <div class="stitchline"></div>

  <div class="chips" id="categoryChips"></div>

  <div class="chips" id="directionChips">
    <div class="chip" data-dir="ar2he">ערבית ← עברית</div>
    <div class="chip" data-dir="he2ar">עברית ← ערבית</div>
    <div class="chip" data-dir="mixed">מעורב</div>
  </div>

  <div class="stats">
    <span>כרטיס <b id="statPos">1</b> / <span id="statTotal">0</span></span>
    <span>✓ <b id="statGood">0</b> &nbsp; ✗ <b id="statBad">0</b></span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div id="cardZone">
    <div class="card" id="card">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="direction-label" id="dirLabel">ערבית</div>
      <div class="prompt arabic" id="promptText">—</div>
      <div class="translit" id="translitText"></div>
      <div class="answer-area" id="answerArea"></div>
      <button class="reveal-btn" id="revealBtn">הראה תשובה</button>
      <div class="grade-row" id="gradeRow" style="display:none;">
        <button class="grade-btn bad" id="badBtn">לא ידעתי</button>
        <button class="grade-btn good" id="goodBtn">ידעתי ✓</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="icon-btn" id="shuffleBtn">🔀 ערבב</button>
    <button class="icon-btn" id="restartBtn">↺ התחל מחדש</button>
  </div>

  <footer>כל המילים מתוך שיחות התרגול שלך · שמור קובץ זה במכשיר לשימוש ללא אינטרנט</footer>
</div>

// ---------------- State ----------------
let deck = [];
let idx = 0;
let good = 0, bad = 0;
let revealed = false;
let direction = "ar2he"; // ar2he | he2ar | mixed
let activeCategory = "הכל";
let currentDirForCard = "ar2he";

const categories = ["הכל", ...Array.from(new Set(VOCAB.map(v => v[3])))];

// ---------------- DOM refs ----------------
const promptText = document.getElementById('promptText');
const translitText = document.getElementById('translitText');
const answerArea = document.getElementById('answerArea');
const revealBtn = document.getElementById('revealBtn');
const gradeRow = document.getElementById('gradeRow');
const dirLabel = document.getElementById('dirLabel');
const statPos = document.getElementById('statPos');
const statTotal = document.getElementById('statTotal');
const statGood = document.getElementById('statGood');
const statBad = document.getElementById('statBad');
const progressFill = document.getElementById('progressFill');
const cardZone = document.getElementById('cardZone');
const categoryChips = document.getElementById('categoryChips');
const directionChips = document.getElementById('directionChips');

// ---------------- Build category chips ----------------
categories.forEach(cat => {
  const chip = document.createElement('div');
  chip.className = 'chip' + (cat === activeCategory ? ' active' : '');
  chip.textContent = cat;
  chip.dataset.cat = cat;
  chip.addEventListener('click', () => {
    activeCategory = cat;
    [...categoryChips.children].forEach(c => c.classList.toggle('active', c.dataset.cat === cat));
    buildDeck();
  });
  categoryChips.appendChild(chip);
});

[...directionChips.children].forEach(chip => {
  if(chip.dataset.dir === direction) chip.classList.add('active');
  chip.addEventListener('click', () => {
    direction = chip.dataset.dir;
    [...directionChips.children].forEach(c => c.classList.toggle('active', c.dataset.dir === direction));
    buildDeck();
  });
});

// ---------------- Deck logic ----------------
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck(){
  const source = activeCategory === "הכל" ? VOCAB : VOCAB.filter(v => v[3] === activeCategory);
  deck = shuffle(source);
  idx = 0; good = 0; bad = 0;
  statTotal.textContent = deck.length;
  renderCard();
}

function pickDirForCard(){
  if(direction === "mixed") return Math.random() < 0.5 ? "ar2he" : "he2ar";
  return direction;
}

function renderCard(){
  revealed = false;
  gradeRow.style.display = 'none';
  revealBtn.style.display = 'inline-block';
  answerArea.innerHTML = '';

  if(idx >= deck.length){
    showDone();
    return;
  }

  const [ar, tr, he, cat] = deck[idx];
  currentDirForCard = pickDirForCard();

  if(currentDirForCard === "ar2he"){
    dirLabel.textContent = "ערבית → עברית";
    promptText.className = "prompt arabic";
    promptText.textContent = ar;
    translitText.textContent = tr;
  } else {
    dirLabel.textContent = "עברית → ערבית";
    promptText.className = "prompt";
    promptText.textContent = he;
    translitText.textContent = "";
  }

  statPos.textContent = idx + 1;
  statGood.textContent = good;
  statBad.textContent = bad;
  progressFill.style.width = (idx / deck.length * 100) + "%";
}

function reveal(){
  const [ar, tr, he] = deck[idx];
  revealed = true;
  if(currentDirForCard === "ar2he"){
    answerArea.innerHTML = '<div class="answer">' + he + '</div>';
  } else {
    answerArea.innerHTML = '<div class="answer">' + ar + '</div><div class="translit" style="margin-top:4px;">' + tr + '</div>';
  }
  revealBtn.style.display = 'none';
  gradeRow.style.display = 'flex';
}

function grade(isGood){
  if(isGood) good++; else bad++;
  idx++;
  renderCard();
}

function showDone(){
  progressFill.style.width = "100%";
  statPos.textContent = deck.length;
  statGood.textContent = good;
  statBad.textContent = bad;
  const pct = deck.length ? Math.round(good / deck.length * 100) : 0;
  cardZone.innerHTML = `
    <div class="card done-screen">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="big">סיימת את החפיסה!</div>
      <div class="score">${pct}%</div>
      <div style="color:var(--ink-soft); font-size:14px;">✓ ${good} ידעת &nbsp; · &nbsp; ✗ ${bad} לתרגל שוב</div>
    </div>
  `;
}

function rebuildCardZone(){
  cardZone.innerHTML = `
    <div class="card" id="card">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="direction-label" id="dirLabel">ערבית</div>
      <div class="prompt arabic" id="promptText">—</div>
      <div class="translit" id="translitText"></div>
      <div class="answer-area" id="answerArea"></div>
      <button class="reveal-btn" id="revealBtn">הראה תשובה</button>
      <div class="grade-row" id="gradeRow" style="display:none;">
        <button class="grade-btn bad" id="badBtn">לא ידעתי</button>
        <button class="grade-btn good" id="goodBtn">ידעתי ✓</button>
      </div>
    </div>
  `;
  bindCardEvents();
}

function bindCardEvents(){
  document.getElementById('revealBtn').addEventListener('click', reveal);
  document.getElementById('badBtn').addEventListener('click', () => grade(false));
  document.getElementById('goodBtn').addEventListener('click', () => grade(true));
}

// initial bind (elements exist in original HTML)
revealBtn.addEventListener('click', reveal);
document.getElementById('badBtn').addEventListener('click', () => grade(false));
document.getElementById('goodBtn').addEventListener('click', () => grade(true));

document.getElementById('shuffleBtn').addEventListener('click', () => {
  deck = shuffle(deck.slice(idx)).concat(deck.slice(0, idx));
  // simpler: reshuffle remaining cards only
  const remaining = shuffle(deck.slice(idx));
  deck = deck.slice(0, idx).concat(remaining);
  renderCard();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  rebuildCardZoneIfNeeded();
  buildDeck();
});

function rebuildCardZoneIfNeeded(){
  if(!document.getElementById('card')){
    rebuildCardZone();
  }
}

// Patch renderCard/showDone to rebuild card zone when returning from done screen
const originalBuildDeck = buildDeck;
buildDeck = function(){
  rebuildCardZoneIfNeeded();
  originalBuildDeck();
};


// ---------------- Offline support ----------------
// sw.js precaches the whole app on install; see sw.js.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

// ---------------- Init ----------------
buildDeck();
</script>
